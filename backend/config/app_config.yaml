# Application Configuration
# Centralized configuration for all application settings

# Logging Configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

# LLM Configuration
llm:
  # Enable/disable LLM end-to-end (compute + serve)
  enabled: true

  # Batching controls for graph annotation
  batch_threshold: 50
  max_nodes_per_batch: 30

# Azure AI Foundry Agent Configuration
# APIM-governed runtime (no direct Foundry endpoint access from backend)
# These values can also be provided via environment variables:
#   AI_GATEWAY_AGENT_BASE_URL
#   AI_GATEWAY_SUBSCRIPTION_KEY
#   AI_GATEWAY_SUBSCRIPTION_HEADER_NAME
#   AI_GATEWAY_API_VERSION
#   AI_GATEWAY_CHAT_AGENT_ID
#   AI_GATEWAY_RESILIENCE_AGENT_ID
#   AI_GATEWAY_ANNOTATIONS_AGENT_ID
#   AI_GATEWAY_MEMORY_SCOPE
ai_agent:
  gateway_base_url: "https://resilience-iq-api.azure-api.net/ResilienceIQ/api/projects/resilience-iq-project"
  embedding_base_url: "https://resilience-iq-api.azure-api.net/ResilienceIQ/openai"
  embedding_api_version: "2024-10-21"
  embedding_subscription_header_name: "api-key"
  # Flow-specific assistant ids for backend orchestration.
  chat_agent_id: "asst_lRxtTuJn3kqUQKro71DtDIwY"
  resilience_agent_id: "asst_0tifj1O2yZfwUtajQV119hpR"
  annotations_agent_id: "asst_8IRSMF2qnhTFr7HIHhfFD9b1"
  api_version: "2025-05-01"
  subscription_header_name: "api-key"
  # subscription_or_workload keeps one shared thread per process (stateful memory)
  # stateless creates a new thread per request
  memory_scope: "subscription_or_workload"
  run_timeout_seconds: 120
  poll_interval_seconds: 1.5

# Data Paths
data:
  dir: "./data"
  monitored_resource_types_path: "./config/monitored_resource_types.yaml"

# Resiliency Analysis Configuration
resilience:
  # Category weights for resilience scoring
  # Must sum to 1.0 (normalized automatically if not)
  category_weights:
    "HighAvailability": 0.30
    "DisasterRecovery": 0.20
    "Scalability": 0.20
    "MonitoringAndAlerting": 0.15
    "Security": 0.10
    "OtherBestPractices": 0.05

  # Impact-to-weight mapping for individual checks
  # Higher impact checks count more toward category score
  impact_weights:
    "High": 0.6
    "Medium": 0.3
    "Low": 0.1
  
  # APRL v2 directory (relative to backend directory, or absolute path)
  aprl_root: "aprl"
  
  # Rules directory for resilience checks
  rules_dir: "./config/resiliency_rules"

  # Default Microsoft Learn URLs by resource type prefix (lowercase)
  learn_more_defaults:
    "microsoft.network/virtualnetworks": "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview"
    "microsoft.containerregistry/registries": "https://learn.microsoft.com/en-us/azure/container-registry/container-registry-best-practices"
    "microsoft.containerservice/managedclusters": "https://learn.microsoft.com/en-us/azure/aks/availability-zones"
    "microsoft.storage/storageaccounts": "https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy"
    "microsoft.storage/storageaccounts/blobservices/containers": "https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-overview"
    "microsoft.sql/servers/databases": "https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla"
    "microsoft.sql/servers": "https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla"
    "microsoft.documentdb/databaseaccounts": "https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability"
  
  # Azure resource types that are zone-irrelevant or zone-resilient by default
  # These do NOT require zone configuration (control plane, regional networking, global services)
  # Based on: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
  zone_irrelevant_types:
    # Control Plane / Metadata - no zone dependency
    - "microsoft.resources/resourcegroups"
    - "microsoft.managedidentity/userassignedidentities"
    - "microsoft.authorization/roleassignments"
    - "microsoft.authorization/policyassignments"
    - "microsoft.authorization/roledefinitions"
    - "microsoft.resources/deployments"
    - "microsoft.resources/tags"
    - "microsoft.compute/sshpublickeys"
    - "microsoft.devtestlab/schedules"
    - "microsoft.blueprints/blueprints"
    
    # Regional Networking - automatically span all zones
    - "microsoft.network/virtualnetworks"
    - "microsoft.network/networksecuritygroups"
    - "microsoft.network/routetables"
    - "microsoft.network/applicationsecuritygroups"
    - "microsoft.network/networkwatchers"
    - "microsoft.network/ddosprotectionplans"
    - "microsoft.network/privatednszones"
    
    # Global Services - operate across regions, zones irrelevant
    - "microsoft.network/trafficmanagerprofiles"
    - "microsoft.network/frontdoors"
    - "microsoft.network/frontdoorwebapplicationfirewallpolicies"
    - "microsoft.network/dnszones"
    - "microsoft.cdn/profiles"
    - "microsoft.aad/domainservices"
    - "microsoft.azureactivedirectory/b2ctenants"
    
    # Management & Governance - control plane
    - "microsoft.management/managementgroups"
    - "microsoft.resources/subscriptions"
    - "microsoft.advisor/recommendations"
    - "microsoft.policyinsights/policyevaluations"
    - "microsoft.resourcegraph/queries"
    - "microsoft.costmanagement/exports"
    - "microsoft.portal/dashboards"
    
    # Monitoring & Alerting - telemetry/metadata only
    - "microsoft.insights/actiongroups"
    - "microsoft.insights/metricalerts"
    - "microsoft.insights/activitylogalerts"
    - "microsoft.insights/scheduledqueryrules"
    - "microsoft.alertsmanagement/actionrules"
