# Azure Resource Reference Definitions
#
# Defines source->target relationships and where to find the reference in properties.
# Users can extend this to add new reference patterns.
#
# Schema:
#   source_type: Azure resource type of the source (e.g., microsoft.network/privateendpoints)
#   target_type: Azure resource type of the target (optional, null = auto-detect from ID)
#   relationship: Relationship name (e.g., private_link_to)
#   reference_field: JSON path WITHIN resource.properties where target ID(s) are stored
#                    (e.g., "storageProfile.osDisk.managedDisk.id" not "properties.storageProfile...")
#   is_array: Whether the reference field is an array (e.g., [].id vs single id)
#   confidence: Confidence score for this relationship type (0.0-1.0)
#   description: Human-readable description

# === Networking ===
- source_type: microsoft.network/virtualnetworks
  target_type: null
  relationship: contains_subnet
  reference_field: subnets[].id
  is_array: true
  confidence: 0.98
  description: VNet contains Subnets

- source_type: microsoft.network/networkinterfaces
  target_type: null
  relationship: attached_to_subnet
  reference_field: ipConfigurations[].properties.subnet.id
  is_array: true
  confidence: 0.95
  description: NIC attached to Subnet

- source_type: microsoft.network/networkinterfaces
  target_type: microsoft.network/publicipaddresses
  relationship: uses_public_ip
  reference_field: ipConfigurations[].properties.publicIPAddress.id
  is_array: true
  confidence: 0.95
  description: NIC uses Public IP

- source_type: microsoft.network/networkinterfaces
  target_type: microsoft.network/networksecuritygroups
  relationship: protected_by_nsg
  reference_field: networkSecurityGroup.id
  is_array: false
  confidence: 0.95
  description: NIC protected by NSG

- source_type: microsoft.network/subnets
  target_type: microsoft.network/networksecuritygroups
  relationship: protected_by_nsg
  reference_field: networkSecurityGroup.id
  is_array: false
  confidence: 0.90
  description: Subnet protected by NSG

- source_type: microsoft.network/subnets
  target_type: microsoft.network/routetables
  relationship: routed_by_route_table
  reference_field: routeTable.id
  is_array: false
  confidence: 0.90
  description: Subnet routed by Route Table

