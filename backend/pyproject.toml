[project]
name = "azure-resilience-iq"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-dotenv",
  "python-multipart",
  "httpx",
  "pyyaml",
  "python-hcl2",

  "azure-identity",
  "azure-ai-projects>=2.0.0b4,<2.1.0",
  "azure-ai-agents>=1.1.0",
  "azure-search-documents",
  "openai",
  "azure-mgmt-resourcegraph",
  "azure-mgmt-subscription",
  
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
