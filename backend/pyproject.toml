[project]
name = "azure-workload-graph"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-dotenv",
  "python-multipart",
  "httpx",
  "pyyaml",

  "azure-identity",
  "azure-ai-projects",
  "azure-search-documents",
  "azure-mgmt-resourcegraph",
  "azure-mgmt-subscription",
  
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
