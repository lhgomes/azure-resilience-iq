      description: "Consider zone-redundant or multi-zone deployment"
      recommendationControl: HighAvailability
      recommendationImpact: Medium
      longDescription: |
        Resource is deployed in a single availability zone. Review Azure documentation to determine
        if this resource type supports zone-redundant or multi-zone deployment patterns.
      potentialBenefits: "Improved availability and fault tolerance"
      learnMoreLink:
        - name: "Azure services with availability zones"
          url: "https://learn.microsoft.com/azure/reliability/availability-zones-service-support"
    
    multi_zone_2:
      description: "Add third availability zone for full resilience"
      recommendationControl: HighAvailability
      recommendationImpact: Low
      longDescription: |
        Resource spans 2 availability zones. For complete fault tolerance, distribute across
        all 3 zones if supported by the resource type.
      potentialBenefits: "Complete zone redundancy"
      learnMoreLink:
        - name: "Availability zones overview"
          url: "https://learn.microsoft.com/azure/reliability/availability-zones-overview"
    
    multi_zone_3plus:
      description: "Resource meets 3-AZ deployment requirement"
      recommendationControl: HighAvailability
      recommendationImpact: Low
      longDescription: |
        Resource is properly distributed across 3 or more availability zones, following best practices.
      potentialBenefits: "Maximum availability"
      learnMoreLink:
        - name: "Availability zones best practices"
          url: "https://learn.microsoft.com/azure/reliability/availability-zones-overview"
    
    zone_redundant:
      description: "Zone-redundant configuration active"
      recommendationControl: HighAvailability
      recommendationImpact: Low
      longDescription: |
        Resource uses zone-redundant configuration with automatic cross-zone replication.
      potentialBenefits: "Automatic zone failover"
      learnMoreLink:
