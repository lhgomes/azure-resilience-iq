          url: "https://learn.microsoft.com/azure/reliability/availability-zones-overview"
    
    not_applicable:
      description: "Resource type does not support availability zones"
      recommendationControl: HighAvailability
      recommendationImpact: Low
      longDescription: |
        This resource type does not currently support availability zone deployment.
        Consider regional redundancy or other high-availability patterns.
      potentialBenefits: "N/A"
      learnMoreLink:
        - name: "Azure services availability zones support"
          url: "https://learn.microsoft.com/azure/reliability/availability-zones-service-support"
    
    unknown:
      description: "Verify zone configuration and support"
      recommendationControl: HighAvailability
      recommendationImpact: Medium
